<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Docente - Asistencia</title>
    <style>
        *{box-sizing:border-box;font-family:system-ui,sans-serif;}
        body{background:#f0f4f8;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px;}
        .card{background:white;max-width:400px;width:100%;padding:2rem;border-radius:2rem;box-shadow:0 10px 30px rgba(0,0,0,0.1);text-align:center;}
        select,button{width:100%;padding:0.9rem;margin-top:0.5rem;border-radius:60px;border:1px solid #cbd5e1;font-size:1rem;}
        button{background:#1e3c72;color:white;font-weight:bold;border:none;cursor:pointer;}
        button:disabled{opacity:0.6; cursor:not-allowed;}
        .botones{display:flex;gap:10px;margin-top:1rem;}
        .botones button:first-child{background:#27ae60;}
        .botones button:last-child{background:#e67e22;}
        .error{background:#ffe6e5;color:#b91c1c;padding:0.8rem;border-radius:20px;margin-top:1rem;font-size:0.9rem;}
        .success{background:#e0f2e9;color:#0b5e2e;padding:0.8rem;border-radius:20px;margin-top:1rem;font-size:0.9rem;}
        .progress-bg { background: #e2e8f0; height: 6px; border-radius: 10px; margin-top: 12px; width: 100%;}
        .progress-bar { background: #10b981; height: 100%; transition: width 1s linear; width: 100%; }
        img{max-width:200px;margin:1rem auto;}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>
</head>
<body>
<div class="card">
    <h1>🏫 Mi Asistencia</h1>
    <p style="color:#666; font-size:0.8rem;">Debes estar en la escuela para generar el código.</p>
    
    <select id="emailSelect"><option value="">Cargando datos...</option></select>
    
    <div class="botones">
        <button id="btnEntrada">📥 Entrada</button>
        <button id="btnSalida">📤 Salida</button>
    </div>
    
    <div id="qrPanel" style="display:none; margin-top: 20px;">
        <div id="qrImage"></div>
        <div id="timer" style="font-weight: bold; margin-top: 10px;"></div>
        <div class="progress-bg"><div id="progressBar" class="progress-bar"></div></div>
    </div>
    <div id="msg"></div>
</div>

<script>
    // ⚙️ CONFIGURACIÓN IMPORTANTE
    const API_BASE = 'https://script.google.com/macros/s/AKfycbyKQQe9Zx_8KUOvu7jg9tggbaTCtSVNx-79qyqmrNcr7SMsl6xy8DgSEFMUAdcWQfdX/exec'; 
    const LAT_ESCUELA = 10°28'35.1"N; // <-- 📍 Cambia por tu Latitud
    const LON_ESCUELA = 67°01'34.9; // <-- 📍 Cambia por tu Longitud
    const MAX_DISTANCIA_METROS = 100; // Radio permitido alrededor de la escuela

    const emailSelect = document.getElementById('emailSelect');
    const msgDiv = document.getElementById('msg');
    const qrPanel = document.getElementById('qrPanel');
    const qrImage = document.getElementById('qrImage');
    
    let deviceFingerprint = null;
    let timerInterval = null;

    // Obtener huella
    async function init() {
        try {
            const fp = await FingerprintJS.load();
            const result = await fp.get();
            deviceFingerprint = result.visitorId;
        } catch(e) { deviceFingerprint = "fallback_" + Date.now(); }
        
        fetch(`${API_BASE}?action=getDocentes`).then(r=>r.json()).then(data => {
            emailSelect.innerHTML = '<option value="">-- Selecciona tu correo --</option>';
            if(data.status==='success') data.docentes.forEach(d => emailSelect.innerHTML += `<option value="${d.email}">${d.nombre}</option>`);
        });
    }

    // Fórmula para calcular distancia entre dos coordenadas (Haversine)
    function calcularDistancia(lat1, lon1, lat2, lon2) {
        const R = 6371e3; // Radio de la tierra en metros
        const p1 = lat1 * Math.PI/180, p2 = lat2 * Math.PI/180;
        const dp = (lat2-lat1) * Math.PI/180, dl = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function verificarUbicacion() {
        return new Promise((resolve, reject) => {
            if (!navigator.geolocation) return reject("Tu navegador no soporta GPS.");
            msgDiv.innerHTML = '<div class="success">📍 Verificando ubicación...</div>';
            
            navigator.geolocation.getCurrentPosition(pos => {
                const distancia = calcularDistancia(pos.coords.latitude, pos.coords.longitude, LAT_ESCUELA, LON_ESCUELA);
                if(distancia <= MAX_DISTANCIA_METROS) resolve();
                else reject(`Estás a ${Math.round(distancia)}m. Debes estar a menos de ${MAX_DISTANCIA_METROS}m de la escuela.`);
            }, () => reject("Debes darle permiso de ubicación al navegador para continuar."), {enableHighAccuracy: true});
        });
    }

    async function manejarGenerar(tipo) {
        if (!emailSelect.value) return msgDiv.innerHTML = '<div class="error">Selecciona tu correo.</div>';
        
        document.getElementById('btnEntrada').disabled = true;
        document.getElementById('btnSalida').disabled = true;
        qrPanel.style.display = 'none';

        try {
            await verificarUbicacion(); // 📍 GPS CHECK!
            
            msgDiv.innerHTML = '<div class="success">⏳ Generando código...</div>';
            const url = `${API_BASE}?action=generarToken&email=${encodeURIComponent(emailSelect.value)}&tipo=${tipo}&fingerprint=${deviceFingerprint}`;
            const res = await fetch(url).then(r=>r.json());
            
            if (res.status === 'success') {
                // EL QR AHORA ES SOLO TEXTO DE DATOS, NO UN ENLACE
                const datosQR = `${res.token}|${emailSelect.value}|${tipo}`;
                qrImage.innerHTML = `<img src="https://quickchart.io/qr?text=${encodeURIComponent(datosQR)}&size=250" alt="QR">`;
                qrPanel.style.display = 'block';
                msgDiv.innerHTML = '<div class="success">✅ QR listo. Muéstralo al portero.</div>';
                
                let seg = 60;
                if(timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    seg--; document.getElementById('timer').innerText = `⏱️ Expira en ${seg}s`;
                    document.getElementById('progressBar').style.width = `${(seg/60)*100}%`;
                    if(seg <= 0) { clearInterval(timerInterval); qrPanel.style.display='none'; msgDiv.innerHTML='<div class="error">Expirado. Genera otro.</div>';}
                }, 1000);
            } else throw new Error(res.message);
        } catch (err) {
            msgDiv.innerHTML = `<div class="error">❌ ${err.message || err}</div>`;
        } finally {
            document.getElementById('btnEntrada').disabled = false;
            document.getElementById('btnSalida').disabled = false;
        }
    }

    document.getElementById('btnEntrada').onclick = () => manejarGenerar('entrada');
    document.getElementById('btnSalida').onclick = () => manejarGenerar('salida');
    init();
</script>
</body>
</html>
